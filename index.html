    <script>
      // Restore clean /jyotishsetu/... URLs after GitHub Pages 404.html SPA redirect
      (function () {
        var basePath = '/jyotishsetu';
        var search = window.location.search;
        if (!search || search.indexOf('p=') === -1) return;
        try {
          var params = new URLSearchParams(search);
          var rawPath = params.get('p');
          if (!rawPath) return;
          var cleanPath = rawPath.charAt(0) === '/' ? rawPath : '/' + rawPath;
          if (cleanPath === basePath || cleanPath === basePath + '/') {
            cleanPath = '/';
          } else if (cleanPath.indexOf(basePath + '/') === 0) {
            cleanPath = cleanPath.slice(basePath.length);
          }
          var targetPath = cleanPath === '/' ? basePath + '/' : basePath + cleanPath.replace(/\/+$/, '');
          var rawQuery = params.get('q');
          var queryPart = rawQuery ? '?' + rawQuery : '';
          window.history.replaceState(null, '', targetPath + queryPart + (window.location.hash || ''));
        } catch (e) {
          // Ignore malformed redirect queries gracefully
        }
      })();
    </script>
