
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>JyotishSetu – Redirecting…</title>
    <script>
      // GitHub Pages SPA deep-link handler for the custom domain.
      (function () {
        var l = window.location;
        var pathname = l.pathname || '/';

        var params = '?p=' + encodeURIComponent(pathname);

        if (l.search && l.search.length > 1) {
          params += '&q=' + encodeURIComponent(l.search.slice(1));
        }

        l.replace(
          l.protocol + '//' + l.host + '/' + params + (l.hash || '')
        );
      })();
    </script>
  </head>
  <body></body>
</html>
